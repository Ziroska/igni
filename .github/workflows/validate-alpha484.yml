name: Validate Alpha 4.8.4

on:
  push:
    branches:
      - alpha-4.8.4-shift-service-ux

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha-4.8.4-shift-service-ux
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile debug Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace
      - name: Clean temporary staging files
        if: success()
        run: |
          rm -rf .chatgpt/alpha484 .github/alpha484
          rm -f .github/workflows/apply-alpha484.yml
          rm -f .github/workflows/apply-alpha-484.yml
          rm -f .github/workflows/alpha484-build.yml
          rm -f .github/workflows/validate-alpha484.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize Alpha 4.8.4 branch [skip ci]"
            git push origin HEAD:alpha-4.8.4-shift-service-ux
          fi
